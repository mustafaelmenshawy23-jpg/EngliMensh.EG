name: EngliMensh Grade 1 Pilot APK

on:
  push:
    branches: ['englimensh-new-app']
    paths:
      - 'englimensh-app/**'
      - '.github/workflows/englimensh-grade1-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-grade1-pilot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: englimensh-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: englimensh-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload pilot APK
        uses: actions/upload-artifact@v4
        with:
          name: EngliMensh-Grade1-Pilot-APK
          path: englimensh-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
